  ema21Series: null,
  ema50Series: null,
  ema200Series: null,
  fibLines: [],
  levelLines: [],
  _tvLoaded: false,

  loadTVScript(){
    return new Promise((resolve, reject) => {
      if(window.TradingView){ resolve(); return; }
      if(this._tvLoaded){ reject(new Error('TV load failed')); return; }
      const s = document.createElement('script');
      s.src = 'https://s3.tradingview.com/tv.js';
      s.async = true;
      s.onload = () => { this._tvLoaded = true; resolve(); };
      s.onerror = () => reject(new Error('TV script failed'));
      document.head.appendChild(s);
    });
  },

  async initTV(){
    const container = UTIL.$('#tvchart');
    if(!container) return;
    container.innerHTML = '';
    try{
      await this.loadTVScript();
      const inst = CONFIG.INSTRUMENTS[App.activeSymbol];
      const tf = CONFIG.TF[App.activeTimeframe];
      this.tvWidget = new window.TradingView.widget({
        container_id: 'tvchart',
        autosize: true,
        symbol: inst.tv,
        interval: tf.tv,
        timezone: 'Etc/UTC',
        theme: 'dark',
        style: '1',
        locale: 'ar',
        toolbar_bg: '#111827',
        enable_publishing: false,
        hide_side_toolbar: true,
        allow_symbol_change: false,
        studies: ['RSI@tv-basicstudies', 'MACD@tv-basicstudies'],
        disabled_features: ['use_localstorage_for_settings', 'header_symbol_search'],
        overrides: { 'paneProperties.background': '#0a0e17' }
      });
    } catch(e){
      container.innerHTML = '<div class="empty-state"><div class="big">📈</div><p>تعذر تحميل TradingView</p></div>';
      console.log('🟠 TV load error', e);
    }
  },

  initNative(){
    const container = UTIL.$('#nativeChart');
    if(!container || !window.LightweightCharts) return;
    container.innerHTML = '';
    const chart = window.LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: 220,
      layout: { background: { color: '#0a0e17' }, textColor: '#7b8794', fontSize: 10 },
      grid: { vertLines: { color: '#1f2a3d' }, horzLines: { color: '#1f2a3d' } },
      timeScale: { borderColor: '#1f2a3d', timeVisible: true, secondsVisible: false },
      rightPriceScale: { borderColor: '#1f2a3d' }
    });
    this.nativeChart = chart;
    this.candleSeries = chart.addCandlestickSeries({
      upColor: '#00e5a0', downColor: '#ff3b5c',
      borderUpColor: '#00e5a0', borderDownColor: '#ff3b5c',
      wickUpColor: '#00e5a0', wickDownColor: '#ff3b5c'
    });
    this.ema21Series = chart.addLineSeries({ color: '#38bdf8', lineWidth: 1, priceLineVisible: false });
    this.ema50Series = chart.addLineSeries({ color: '#ffb020', lineWidth: 1, priceLineVisible: false });
    this.ema200Series = chart.addLineSeries({ color: '#a855f7', lineWidth: 1, priceLineVisible: false });

    // resize
    const ro = new ResizeObserver(() => {
      if(container && chart) chart.applyOptions({ width: container.clientWidth });
    });
    ro.observe(container);
  },

  updateNative(bars, indicators){
    if(!this.candleSeries || !bars || !bars.length) return;
    const candles = bars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close }));
    try{
      this.candleSeries.setData(candles);
      if(indicators){
        const mkLine = (arr) => arr.map((v, i) => v != null ? { time: bars[i].time, value: v } : null).filter(x => x);
        this.ema21Series.setData(mkLine(indicators.ema21));
        this.ema50Series.setData(mkLine(indicators.ema50));
        this.ema200Series.setData(mkLine(indicators.ema200));
      }
    } catch(e){ console.log('🟠 native update error', e); }
  },

  drawFib(bars){
    if(!this.candleSeries) return;
    this.clearFib();
    if(!App.settings.fibOnChart) return;
    const retr = Fibonacci.retracement(bars);
    if(!retr) return;
    for(const l of retr.levels){
      const color = l.ratio === 0.618 ? '#00e5a0' :
                    l.ratio === 0.5 ? '#fbbf24' :
                    l.ratio === 0.382 || l.ratio === 0.236 ? '#38bdf8' : '#3a4a6a';
      const line = this.candleSeries.createPriceLine({
        price: l.price,
        color,
        lineWidth: l.ratio === 0.618 ? 2 : 1,
        lineStyle: 2,
        axisLabelVisible: true,
        title: l.label
      });
      this.fibLines.push(line);
    }
  },

  clearFib(){
    for(const l of this.fibLines){
      try{ this.candleSeries.removePriceLine(l); }catch(e){}
    }
    this.fibLines = [];
  },

  drawLevels(sig){
    if(!this.candleSeries || !sig) return;
    this.clearLevels();
    const mk = (price, color, title) => {
      try{
        this.candleSeries.createPriceLine({
          price, color, lineWidth: 1, lineStyle: 0,
          axisLabelVisible: true, title
        });
      } catch(e){}
    };
    mk(sig.entry, '#38bdf8', 'Entry');

/* ==================== 17. Alerts ==================== */
const Alerts = {
  audioCtx: null,

  beep(){
    if(!App.settings.sound) return;
    try{
      if(!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = this.audioCtx;
      const now = ctx.currentTime;
      const play = (freq, t0, dur) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.15, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.05);
      };
      play(880, now, 0.18);
      play(1320, now + 0.18, 0.18);
    } catch(e){}
  },

  requestPermission(){
    if(!App.settings.notify) return;
    if(!('Notification' in window)) return;
    if(Notification.permission === 'default'){
      Notification.requestPermission().catch(() => {});
    }
  },

  notify(title, body){
    if(!App.settings.notify) return;
    try{
      if('Notification' in window && Notification.permission === 'granted'){
        new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>' });
      }
    } catch(e){}
  },

  toast(msg, type='info'){
    const c = UTIL.$('#toasts');
    const t = UTIL.el('div', { class: 'toast ' + type }, msg);
    c.appendChild(t);
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateX(-20px)';
      t.style.transition = 'all .3s';
      setTimeout(() => t.remove(), 320);
    }, 4400);
  },

  async telegram(msg){
    const url = App.settings.telegram;
    if(!url) return;
    try{
      // url should be like https://api.telegram.org/botXXX/sendMessage?chat_id=YYY
      const sep = url.includes('?') ? '&' : '?';
      await fetch(url + sep + 'text=' + encodeURIComponent(msg), { method: 'POST' });
    } catch(e){}
  },

  fire(type, trade){
    const titles = {
      NEW_SIGNAL: '🎯 إشارة جديدة',
      TP1: '✅ تحقق الهدف الأول',
      TP2: '✅ تحقق الهدف الثاني',
      TP3: '🎉 تحقق الهدف الثالث',
      SL: '🛑 ضرب وقف الخسارة'
    };
    let msg = '';
    if(type === 'NEW_SIGNAL'){
      msg = `${trade.symbol} ${trade.direction} · Score ${trade.score} · ${trade.tier}`;
    } else if(trade){
      msg = `${trade.symbol} ${trade.direction} · ${UTIL.fmt(trade.rMultiple || 0, 2)}R`;
    }
    const t = titles[type] || type;
    this.toast(t + ': ' + msg, type === 'SL' ? 'error' : type.startsWith('TP') ? 'success' : 'info');
    if(type === 'NEW_SIGNAL' || type.startsWith('TP') || type === 'SL'){
      this.beep();
      this.notify(t, msg);
      this.telegram(t + '\n' + msg);
    }
  }
};

  drawSpark(symbolKey){
    const canvas = UTIL.$('#spark_' + symbolKey);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const arr = App.prices1m[symbolKey] || [];
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    if(arr.length < 2) return;
    const mn = Math.min(...arr), mx = Math.max(...arr);
    const rng = mx - mn || 1;
    ctx.beginPath();
    for(let i = 0; i < arr.length; i++){
      const x = (i / (arr.length - 1)) * w;
      const y = h - ((arr[i] - mn) / rng) * (h - 4) - 2;
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    const up = arr[arr.length - 1] >= arr[0];
    ctx.strokeStyle = up ? '#00e5a0' : '#ff3b5c';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  },

  drawEquityCurve(curve){
    const c = UTIL.$('#eqChart');
    if(!c) return;
    const dpr = window.devicePixelRatio || 1;
    c.width = c.clientWidth * dpr;
    c.height = c.clientHeight * dpr;
    const ctx = c.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = c.clientWidth, H = c.clientHeight;
    ctx.clearRect(0, 0, W, H);
    if(curve.length < 2) return;
    const mn = Math.min(...curve), mx = Math.max(...curve);
    const rng = mx - mn || 1;
    const pad = 20;
    // zero line
    const zeroY = H - pad - ((0 - mn) / rng) * (H - 2 * pad);
    ctx.strokeStyle = '#1f2a3d';
    ctx.beginPath(); ctx.moveTo(0, zeroY); ctx.lineTo(W, zeroY); ctx.stroke();
    // line
    ctx.beginPath();
    for(let i = 0; i < curve.length; i++){
      const x = pad + (i / (curve.length - 1)) * (W - 2 * pad);
      const y = H - pad - ((curve[i] - mn) / rng) * (H - 2 * pad);
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = curve[curve.length - 1] >= 0 ? '#00e5a0' : '#ff3b5c';
    ctx.lineWidth = 2;
    ctx.stroke();
    // fill
    ctx.lineTo(W - pad, zeroY); ctx.lineTo(pad, zeroY); ctx.closePath();
    const grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, curve[curve.length - 1] >= 0 ? 'rgba(0,229,160,.2)' : 'rgba(255,59,92,.2)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fill();
  },

  drawRDist(){
    const c = UTIL.$('#rChart');
    if(!c) return;
    const closed = Journal.closed();
    if(!closed.length) return;
    const dpr = window.devicePixelRatio || 1;
    c.width = c.clientWidth * dpr;
    c.height = c.clientHeight * dpr;
    const ctx = c.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = c.clientWidth, H = c.clientHeight;
    ctx.clearRect(0, 0, W, H);
    // bucket from -3 to +5
    const buckets = {};
    for(const t of closed){
      const r = t.rMultiple || 0;
      let b = Math.floor(r);
      if(b < -3) b = -3;
      if(b > 5) b = 5;
      buckets[b] = (buckets[b] || 0) + 1;
    }
    const keys = Object.keys(buckets).map(Number).sort((a,b) => a-b);
    const mx = Math.max(...Object.values(buckets), 1);
    const bw = (W - 40) / keys.length;
    for(let i = 0; i < keys.length; i++){
      const k = keys[i];
      const x = 20 + i * bw + bw * 0.15;
      const bh = (buckets[k] / mx) * (H - 30);
      const y = H - 20 - bh;
      ctx.fillStyle = k >= 0 ? '#00e5a0' : '#ff3b5c';
      ctx.fillRect(x, y, bw * 0.7, bh);
      ctx.fillStyle = '#7b8794';
      ctx.font = '10px JetBrains Mono';
      ctx.textAlign = 'center';
      ctx.fillText(k >= 0 ? `+${k}` : k, x + bw * 0.35, H - 6);
    }
  },

        <div class="stat-box"><div class="lbl">إجمالي R</div><div class="val ${s.totalR >= 0 ? 'up' : 'dn'}">${UTIL.fmt(s.totalR, 2)}</div></div>
        <div class="stat-box"><div class="lbl">متوسط R</div><div class="val ${s.avgR >= 0 ? 'up' : 'dn'}">${UTIL.fmt(s.avgR, 2)}</div></div>

        <div></div><div></div><div></div>
      </div>`;

      const recent = r.trades.slice(-30).reverse();

      <div style="font-weight:600;font-size:12px;margin-bottom:8px">➕ إضافة مفتاح جديد</div>
      <div style="margin-bottom:8px">
        <label style="display:block;font-size:10px;color:var(--muted);margin-bottom:3px">الاسم المختصر</label>
        <input type="text" id="newKeyLabel" style="width:100%;padding:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit" placeholder="مثال: حساب تجريبي">
      </div>
      <div style="margin-bottom:10px">
        <label style="display:block;font-size:10px;color:var(--muted);margin-bottom:3px">المفتاح</label>
        <input type="password" id="newKeyValue" style="width:100%;padding:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'JetBrains Mono',monospace;direction:ltr" placeholder="ألصق المفتاح هنا">
      </div>
      <button class="btn primary" id="btnAddKey" style="width:100%;justify-content:center">➕ إضافة والتحقق</button>
      <div id="addKeyStatus" style="font-size:11px;margin-top:8px;text-align:center"></div>
    </div>

    <div style="margin-top:12px;padding:10px;background:var(--panel-2);border-radius:6px;font-size:10px;color:var(--muted);line-height:1.7">
      💡 احصل على مفتاح مجاني من:
      <a href="https://twelvedata.com/pricing" target="_blank" style="color:var(--blue)">twelvedata.com/pricing</a>
      <br>📌 الباقة المجانية: 8 طلبات/دقيقة · 800 طلب/يوم · WebSocket غير محدود
    </div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>إغلاق</button>
    </div>`;

    m.innerHTML = html;

    UTIL.$$('[data-close]', m).forEach(b => b.addEventListener('click', () => m.parentElement.remove()));

    UTIL.$$('[data-act]', m).forEach(b => b.addEventListener('click', async () => {
      KeyManager.activate(b.dataset.act);
      this._renderKeysModal(m);
      App.hardReset();
      await App.startAfterKey();
      this.toast('🔑 تم تفعيل المفتاح', 'success');
    }));

    UTIL.$$('[data-del]', m).forEach(b => b.addEventListener('click', () => {
      if(confirm('حذف هذا المفتاح؟')){
        const wasActive = b.dataset.del === KeyManager._data.activeId;
        KeyManager.remove(b.dataset.del);
        this._renderKeysModal(m);
        if(wasActive){
          App.hardReset();
          App.startAfterKey();
        }
      }
    }));

    UTIL.$('#btnAddKey', m).addEventListener('click', async () => {
      const label = UTIL.$('#newKeyLabel', m).value.trim();
      const val = UTIL.$('#newKeyValue', m).value.trim();
      const stat = UTIL.$('#addKeyStatus', m);
      if(!val){ stat.textContent = '❌ أدخل قيمة المفتاح'; stat.style.color = 'var(--red)'; return; }
      stat.textContent = '⏳ جارٍ التحقق...'; stat.style.color = 'var(--muted)';
      const res = await DataFeed.validateKey(val);
      if(res.ok){
        const k = KeyManager.add(label, val);
        KeyManager.markOK(k.id);
        stat.textContent = '✅ تم التحقق والحفظ'; stat.style.color = 'var(--green)';
        App.hardReset();
        await App.startAfterKey();
        setTimeout(() => this._renderKeysModal(m), 400);
        this.toast('✅ تمت إضافة المفتاح بنجاح', 'success');
      } else if(res.reason === 'exhausted'){
        const k = KeyManager.add(label, val);
        KeyManager.markExhausted(k.id);
        stat.textContent = '⏳ المفتاح صالح لكن الحصة منتهية — سيُعاد المحاولة بعد 60 ثانية';
        stat.style.color = 'var(--orange)';
        setTimeout(() => this._renderKeysModal(m), 600);
      } else {
        stat.textContent = '❌ ' + res.msg;
        stat.style.color = 'var(--red)';
      }
    });
  },

  openSettingsModal(){
    const bg = UTIL.el('div', { class: 'modal-bg' });
    const m = UTIL.el('div', { class: 'modal' });
    bg.appendChild(m);
    document.body.appendChild(bg);
    bg.addEventListener('click', (e) => { if(e.target === bg) bg.remove(); });

    const s = App.settings;
    m.innerHTML = `<div class="modal-head">
      <h3>⚙️ الإعدادات</h3>
      <button class="close-x" data-close>×</button>
    </div>
    <div class="modal-body">
      <div class="set-row">
        <div><label>الرصيد ($)</label><div class="hint">رصيد الحساب للتداول</div></div>
        <input type="number" id="setBalance" value="${s.balance}" min="100" step="100">
      </div>
      <div class="set-row">
        <div><label>مخاطرة الصفقة (%)</label><div class="hint">من 0.1 إلى 3</div></div>
        <input type="number" id="setRisk" value="${s.riskPct}" min="0.1" max="3" step="0.1">
      </div>
      <div class="set-row">
        <div><label>الحد الأقصى للـ Heat (%)</label><div class="hint">من 1 إلى 20</div></div>
        <input type="number" id="setHeat" value="${s.maxHeat}" min="1" max="20" step="0.5">
      </div>
      <div class="set-row">
        <div><label>الحد الأدنى للنتيجة</label><div class="hint">من 50 إلى 100</div></div>
        <input type="number" id="setMinScore" value="${s.minScore}" min="50" max="100">
      </div>
      <div class="set-row">
        <div><label>الصوت</label><div class="hint">تنبيه صوتي عند الإشارة</div></div>
        <input type="checkbox" id="setSound" ${s.sound ? 'checked' : ''}>
      </div>
      <div class="set-row">
        <div><label>إشعارات المتصفح</label><div class="hint">يتطلب إذن المتصفح</div></div>
        <input type="checkbox" id="setNotify" ${s.notify ? 'checked' : ''}>
      </div>
      <div class="set-row">
        <div><label>Telegram Webhook</label><div class="hint">رابط اختياري للتنبيهات</div></div>
        <input type="text" id="setTg" value="${UTIL.esc(s.telegram)}" placeholder="https://api.telegram.org/...">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>إلغاء</button>
      <button class="btn primary" id="setSave">💾 حفظ</button>
    </div>`;

    UTIL.$$('[data-close]', m).forEach(b => b.addEventListener('click', () => m.parentElement.remove()));
    UTIL.$('#setSave', m).addEventListener('click', () => {
      const bal = parseFloat(UTIL.$('#setBalance', m).value);
      const rk = parseFloat(UTIL.$('#setRisk', m).value);
      const ht = parseFloat(UTIL.$('#setHeat', m).value);
      const ms = parseFloat(UTIL.$('#setMinScore', m).value);
      if(isFinite(bal) && bal > 0) App.settings.balance = bal;
      if(isFinite(rk)) App.settings.riskPct = UTIL.clamp(rk, 0.1, 3);
      if(isFinite(ht)) App.settings.maxHeat = UTIL.clamp(ht, 1, 20);
      if(isFinite(ms)) App.settings.minScore = UTIL.clamp(ms, 50, 100);
      App.settings.sound = UTIL.$('#setSound', m).checked;
      App.settings.notify = UTIL.$('#setNotify', m).checked;
      App.settings.telegram = UTIL.$('#setTg', m).value.trim();
      App.saveSettings();
      if(App.settings.notify) Alerts.requestPermission();
      Journal.updateHeat();
      this.renderSettings();
      this.renderSignal();
      this.toast('✅ تم حفظ الإعدادات', 'success');
      m.parentElement.remove();
    });
  },

  renderSettings(){
    // reserved for inline settings panel; not needed but kept
  },

  exportCSV(){
    const trades = Journal.trades();
    if(!trades.length){ this.toast('لا توجد صفقات للتصدير', 'warn'); return; }
    const headers = ['id','openedAt','closedAt','symbol','direction','entry','sl','tp1','tp2','tp3','score','tier','atr','status','exitPrice','exitReason','pnl','pnlPips','rMultiple','mae','mfe','timeframe','session'];
    const rows = [headers.join(',')];
    for(const t of trades){
      rows.push(headers.map(h => {
        let v = t[h];
        if(v == null) return '';
        if(Array.isArray(v)) v = v.join('|');
        return '"' + String(v).replace(/"/g, '""') + '"';
      }).join(','));
    }
    const csv = '\uFEFF' + rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'trades_' + UTIL.dateStr(Date.now()) + '.csv';
    a.click(); URL.revokeObjectURL(url);
  },

  exportJSON(){
    const data = { exportedAt: new Date().toISOString(), trades: Journal.trades() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'trades_' + UTIL.dateStr(Date.now()) + '.json';
    a.click(); URL.revokeObjectURL(url);
  }
};

/* ==================== 19. App Logic ==================== */
App.loadSettings = function(){
  const s = Store.get(CONFIG.STORE_SETTINGS, null);
  if(s && s._v === 5){
    App.settings = { ...CONFIG.DEFAULT_SETTINGS, ...s };
  } else {
    App.settings = { ...CONFIG.DEFAULT_SETTINGS };
    Store.set(CONFIG.STORE_SETTINGS, App.settings);
  }
  App.activeSymbol = App.settings.activeSymbol || 'XAUUSD';
  App.activeTimeframe = App.settings.timeframe || 'M15';
};

App.saveSettings = function(){
  App.settings._v = 5;
  Store.set(CONFIG.STORE_SETTINGS, App.settings);
};

App.startAfterKey = async function(){
  if(App.booted) return;
  const key = KeyManager.getUsable();
  if(!key){
    UTIL.$('#noKeyBanner').classList.remove('hidden');
    UTIL.$('#appContent').classList.add('hidden');
    return;
  }
  try{
    UTIL.$('#noKeyBanner').classList.add('hidden');
    UTIL.$('#appContent').classList.remove('hidden');
    App.booted = true;
    KeyManager.markOK(key.id);
    console.log('🔵 Boot starting with key:', key.label);

    // Resolve symbols
    try{ await DataFeed.resolveSymbols(); }
    catch(e){
      if(e.message === 'AUTH'){ 
        const nk = KeyManager.switchNext();
        if(nk){ App.hardReset(); return App.startAfterKey(); }
        Alerts.toast('🔑 لا توجد مفاتيح صالحة', 'error'); return;
      }
      if(e.message === 'RATE'){ await UTIL.sleep(15000); }
    }

    // Initial fetch
    await App.fetchAllCandles();
    UI.selectSymbol(App.activeSymbol);

    // Initial price snapshot
    try{
      const prices = await DataFeed.fetchPricesBatch();
      const now = Date.now();
      for(const k in prices) DataFeed.onTick(k, prices[k], now);
    } catch(e){}

    // Start WS
    DataFeed.connectWS();

    // Candle timer (every 60s)
    clearInterval(App._candleTimer);
    App._candleTimer = setInterval(() => {
      if(!App.booted) return;
      App.fetchAllCandles().catch(() => {});
    }, 60000);

    // Signal recompute timer (every 30s)
    if(App._signalTimer) clearInterval(App._signalTimer);
    App._signalTimer = setInterval(() => App.recomputeSignals(), 30000);
    App.recomputeSignals();

    // Initial render
    UI.renderJournal();
    console.log('🟢 App booted successfully');
  } catch(e){
    console.log('🔴 startAfterKey error', e);
    Alerts.toast('⚠️ خطأ في بدء التشغيل: ' + (e.message || ''), 'error');
    App.booted = false;
  }
};

App.fetchAllCandles = async function(){
  const tfKey = App.activeTimeframe;
  const now = Date.now();
  for(const sym of Object.keys(CONFIG.INSTRUMENTS)){
    const cacheKey = sym + '_' + tfKey;
    if(App._lastCandleFetch[cacheKey] && (now - App._lastCandleFetch[cacheKey]) < 60000) continue;
    try{
      const bars = await DataFeed.fetchCandles(sym, tfKey, 500);
      App.candles[sym] = bars;
      App.ind[cacheKey] = Strategy.computeIndicators(bars);
      App._lastCandleFetch[cacheKey] = Date.now();
      const sig = Strategy.analyze(bars, sym, tfKey);
      if(sig){
        App.signals[sym] = sig;
        // fire alert if new and score >= 70
        const alertKey = sym + '_' + sig.direction;
        const last = App._lastSignalAlert[alertKey] || 0;
        if(sig.score >= 70 && (now - last) > 600000){
          App._lastSignalAlert[alertKey] = now;
          Alerts.fire('NEW_SIGNAL', sig);
        }
      }
      await UTIL.sleep(300);
    } catch(e){
      if(e.message === 'AUTH'){
        const nk = KeyManager.switchNext();
        if(nk){ App.hardReset(); return App.startAfterKey(); }
      } else if(e.message === 'RATE'){
        App._rateLimitUntil = Date.now() + 15000;
      }
    }
  }
};

App.recomputeSignals = function(){
  for(const sym of Object.keys(CONFIG.INSTRUMENTS)){
    const bars = App.candles[sym];
    if(!bars || bars.length < 200) continue;
    try{
      const sig = Strategy.analyze(bars, sym, App.activeTimeframe);
      if(sig) App.signals[sym] = sig;
    } catch(e){}
  }
  UI.renderSignal();
  // update card tiers
  for(const sym of Object.keys(CONFIG.INSTRUMENTS)){
    const sig = App.signals[sym];
    const tEl = UTIL.$('#tier_' + sym);
    const gEl = UTIL.$('#gauge_' + sym);
    if(!tEl || !gEl) continue;
    if(sig && sig.tier !== 'NO_TRADE' && sig.score >= App.settings.minScore){
      const cls = sig.tier.toLowerCase();
      tEl.className = 'tier-badge ' + cls;
      tEl.textContent = sig.tier;
      gEl.style.width = sig.score + '%';
      gEl.style.background = sig.tier === 'ELITE' ? '#a855f7' : sig.tier === 'STRONG' ? '#00e5a0' : '#ffb020';
    } else {
      tEl.className = 'tier-badge none';
      tEl.textContent = 'انتظار';
      gEl.style.width = '0%';
    }
  }
};

/* ==================== Bootstrap ==================== */
function bootstrap(){
  console.log('⚡ TradeRadar PRO MAX XXX v6.0 starting...');
  App.loadSettings();
  KeyManager.load();
  Journal.load();
  UI.init();

  // Init charts
  if(App.settings.chartMode === 'native'){
    UTIL.$('#tvchart').classList.add('hidden');
    UTIL.$('#nativeChart').classList.remove('hidden');
    UTIL.$('#btnChartMode').textContent = 'TradingView';
    ChartEngine.initNative();
  } else {
    ChartEngine.initTV();
  }

  // Initial state check
  const key = KeyManager.getUsable();
  if(key && key.status !== 'error'){
    App.startAfterKey();
  } else {
    UTIL.$('#noKeyBanner').classList.remove('hidden');
    UTIL.$('#appContent').classList.add('hidden');
  }

  // Recheck exhausted keys every 30s
  setInterval(() => {
    if(!App.booted){
      const k = KeyManager.getUsable();
      if(k && k.status !== 'error'){ App.startAfterKey(); }
    }
  }, 30000);

  // clean up on unload
  window.addEventListener('beforeunload', () => {
    clearInterval(App._wsHeartbeat);
    clearInterval(App._candleTimer);
    clearInterval(App._pricePollTimer);
    clearInterval(App._signalTimer);
    try{ if(App.ws) App.ws.close(); }catch(e){}
  });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}

})();
