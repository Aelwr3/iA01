<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TradeRadar PRO — Deriv Auto-Trader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg:#0b0f19; --panel:#131826; --panel2:#0e1320; --border:#1f2937;
  --text:#e5e7eb; --muted:#6b7280;
  --green:#00ffa3; --red:#ff3b5c; --orange:#ffb020; --purple:#a855f7; --blue:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter','IBM Plex Sans Arabic',system-ui,sans-serif;font-size:13px;line-height:1.5;overflow-x:hidden;direction:rtl}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--panel2)}
::-webkit-scrollbar-thumb{background:#2a3a55;border-radius:4px}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.ltr{direction:ltr;text-align:left}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);min-height:52px;flex-wrap:wrap}
.logo{font-weight:700;font-size:15px;color:var(--green);display:flex;align-items:center;gap:6px;white-space:nowrap}
.logo .badge{font-size:9px;color:var(--muted);font-weight:400;background:var(--panel2);padding:2px 6px;border-radius:4px}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);transition:all .3s;flex-shrink:0}
.status-dot.live{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
.status-dot.connecting{background:var(--orange);animation:pulse 1s infinite}
.status-dot.off{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.spacer{flex:1}
.chip{display:flex;align-items:center;gap:5px;font-size:11px;padding:5px 9px;background:var(--panel2);border-radius:6px;border:1px solid var(--border);white-space:nowrap}
.chip .lbl{color:var(--muted)}
.chip.ok{border-color:rgba(0,255,163,.35);color:var(--green)}
.chip.warn{border-color:rgba(255,176,32,.5);color:var(--orange)}
.chip.danger{border-color:rgba(255,59,92,.5);color:var(--red)}
.btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:11px;font-weight:600;transition:all .15s;font-family:inherit;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{background:var(--panel);border-color:#2e4060}
.btn.primary{background:rgba(0,255,163,.12);border-color:var(--green);color:var(--green)}
.btn.primary:hover{background:rgba(0,255,163,.2)}
.btn.danger{background:rgba(255,59,92,.1);border-color:rgba(255,59,92,.5);color:var(--red)}
.btn.danger:hover{background:rgba(255,59,92,.18)}
.btn.sm{padding:4px 8px;font-size:10px}
.btn.on{background:rgba(0,255,163,.15);border-color:var(--green);color:var(--green)}
.btn.on .dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1s infinite;display:inline-block}

/* ACCOUNT BAR */
.account-bar{display:flex;flex-wrap:wrap;gap:10px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--border)}
.acc-item{display:flex;flex-direction:column;gap:2px;min-width:100px}
.acc-item .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.acc-item .val{font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace}
.demo-badge{background:rgba(255,176,32,.15);color:var(--orange);border:1px solid rgba(255,176,32,.4);font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;align-self:center}
.real-badge{background:rgba(255,59,92,.15);color:var(--red);border:1px solid rgba(255,59,92,.5);font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;align-self:center}

/* MAIN */
.main{padding:12px;max-width:1900px;margin:0 auto}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
@media(max-width:900px){.cards-grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;position:relative;transition:all .2s;cursor:pointer}
.card:hover{border-color:#2e4060}
.card.active{border-color:var(--green);box-shadow:0 0 0 1px rgba(0,255,163,.2)}
.card.pulse-green{animation:pg 1.8s ease-in-out 3}
.card.pulse-purple{animation:pp 1.8s ease-in-out 3}
@keyframes pg{0%,100%{box-shadow:0 0 0 0 rgba(0,255,163,0)}50%{box-shadow:0 0 0 4px rgba(0,255,163,.4)}}
@keyframes pp{0%,100%{box-shadow:0 0 0 0 rgba(168,85,247,0)}50%{box-shadow:0 0 0 4px rgba(168,85,247,.5)}}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.card-sym{font-weight:700;font-size:14px}
.card-name{font-size:10px;color:var(--muted);margin-top:2px}
.card-price{font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace;transition:color .3s}
.card-price.flash-up{animation:fu .5s ease-out}
.card-price.flash-dn{animation:fd .5s ease-out}
@keyframes fu{0%{color:var(--green);text-shadow:0 0 12px rgba(0,255,163,.6)}100%{color:var(--text)}}
@keyframes fd{0%{color:var(--red);text-shadow:0 0 12px rgba(255,59,92,.6)}100%{color:var(--text)}}
.card-chg{font-size:11px;font-weight:600;margin-top:2px}
.card-chg.up{color:var(--green)}
.card-chg.dn{color:var(--red)}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.tier{font-size:9px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:.3px;white-space:nowrap}
.tier.elite{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid rgba(168,85,247,.4)}
.tier.strong{background:rgba(0,255,163,.12);color:var(--green);border:1px solid rgba(0,255,163,.35)}
.tier.medium{background:rgba(255,176,32,.1);color:var(--orange);border:1px solid rgba(255,176,32,.3)}
.tier.none{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.gauge{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;max-width:90px}
.gauge>div{height:100%;width:0;background:var(--green);transition:width .4s ease}
.spark{width:70px;height:26px;display:block}

/* CONTENT */
.content-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:1100px){.content-grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.panel-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-title{font-weight:600;font-size:12px;white-space:nowrap}
.panel-body{padding:12px}
.tf-group{display:flex;gap:3px;flex-wrap:wrap}
.tf-btn{padding:4px 9px;background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:5px;cursor:pointer;font-size:10px;font-weight:600;transition:all .15s;font-family:inherit}
.tf-btn:hover{color:var(--text)}
.tf-btn.active{background:rgba(0,255,163,.12);color:var(--green);border-color:var(--green)}
#tvchart{height:420px;width:100%}
#nativeChart{height:220px;width:100%}
@media(max-width:768px){#tvchart{height:300px}#nativeChart{height:180px}}

/* SIGNAL */
.signal-empty{padding:40px 20px;text-align:center;color:var(--muted)}
.signal-empty .big{font-size:36px;margin-bottom:10px;opacity:.35}
.signal-card{background:var(--panel2);border-radius:10px;padding:14px;border:1px solid var(--border);margin-bottom:10px}
.signal-card.elite{border-color:rgba(168,85,247,.4);background:linear-gradient(180deg,rgba(168,85,247,.06),transparent)}
.signal-card.strong{border-color:rgba(0,255,163,.35);background:linear-gradient(180deg,rgba(0,255,163,.05),transparent)}
.signal-card.medium{border-color:rgba(255,176,32,.3);background:linear-gradient(180deg,rgba(255,176,32,.04),transparent)}
.sig-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.sig-dir{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.sig-dir.buy{color:var(--green)}
.sig-dir.sell{color:var(--red)}
.score-big{font-size:26px;font-weight:700;font-family:'JetBrains Mono',monospace}
.levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.lvl{padding:8px;background:var(--panel);border-radius:6px;border-right:3px solid var(--muted)}
.lvl.entry{border-right-color:var(--blue)}
.lvl.sl{border-right-color:var(--red)}
.lvl.tp{border-right-color:var(--green)}
.lvl .lbl{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase}
.lvl .val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;margin-top:2px}
.reasons-list{list-style:none;margin:8px 0;padding:0}
.reasons-list li{padding:5px 0;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.reasons-list li:last-child{border-bottom:none}
.reasons-list li::before{content:'▸';color:var(--green);font-size:10px}
.risk-box{background:var(--panel);border-radius:8px;padding:10px;margin-top:10px;border:1px solid var(--border)}
.meta-row{display:flex;justify-content:space-between;padding:5px 8px;background:var(--panel2);border-radius:5px;font-size:11px;margin-top:4px}
.meta-row .k{color:var(--muted)}
.meta-row .v{font-family:'JetBrains Mono',monospace;font-weight:600}

/* TABLES */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:10px;background:var(--panel2);position:sticky;top:0}
td.mono{font-family:'JetBrains Mono',monospace}
.buy{color:var(--green);font-weight:600}
.sell{color:var(--red);font-weight:600}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}
.empty-state .big{font-size:40px;margin-bottom:10px;opacity:.35}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat-box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px}
.stat-box .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:600}
.stat-box .val{font-size:17px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-top:3px}
.stat-box .val.up{color:var(--green)}
.stat-box .val.dn{color:var(--red)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;animation:mi .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mi{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel);z-index:2}
.modal-head h3{font-size:14px;font-weight:600}
.modal-body{padding:16px}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.close-x{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.close-x:hover{background:var(--panel2);color:var(--text)}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
.form-row input,.form-row select{width:100%;padding:9px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:12px}
.form-row input:focus{outline:none;border-color:var(--green)}
.form-row .hint{font-size:10px;color:var(--muted);margin-top:3px}
.form-row input.mono{direction:ltr;font-family:'JetBrains Mono',monospace}
.error-box{background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.4);color:var(--red);border-radius:6px;padding:10px;font-size:11px;margin-bottom:10px;display:none}
.error-box.on{display:block}
.warn-box{background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.4);color:var(--orange);border-radius:6px;padding:10px;font-size:11px;margin-bottom:10px;line-height:1.7}
.info-box{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.4);color:var(--blue);border-radius:6px;padding:10px;font-size:11px;margin-bottom:10px;line-height:1.7}

/* TOASTS */
.toasts{position:fixed;top:64px;left:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;max-width:360px}
@media(max-width:600px){.toasts{left:8px;right:8px;max-width:none}}
.toast{background:var(--panel);border:1px solid var(--border);border-right-width:3px;border-radius:8px;padding:10px 14px;font-size:12px;animation:si .25s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 8px 20px rgba(0,0,0,.4);display:flex;gap:10px;align-items:flex-start}
@keyframes si{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.info{border-right-color:var(--blue)}
.toast.success{border-right-color:var(--green)}
.toast.warn{border-right-color:var(--orange)}
.toast.error{border-right-color:var(--red)}
.pos-action{display:flex;gap:3px;justify-content:flex-end}
.pos-action .btn{padding:3px 7px;font-size:9px}
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="logo">
    <span>⚡</span><span>TradeRadar</span>
    <span class="badge">PRO · Deriv</span>
  </div>
  <span class="status-dot off" id="statusDot" title="غير متصل"></span>
  <span class="chip"><span class="lbl">UTC</span><span class="mono ltr" id="utcClock">--:--:--</span></span>
  <span class="chip" id="loginChip"><span class="lbl">Login</span><span class="mono" id="loginVal">—</span></span>
  <div class="spacer"></div>
  <button class="btn" id="btnAutoTrade" title="تفعيل/إيقاف التداول الآلي">🤖 Auto-Trade: OFF</button>
  <button class="btn danger" id="btnKillSwitch" title="إغلاق كل المراكز">🛑 Kill Switch</button>
  <button class="btn" id="btnSettings" title="إعدادات API">⚙️</button>
</header>

<!-- ACCOUNT BAR -->
<section class="account-bar" id="accountBar">
  <div class="acc-item"><div class="lbl">Balance</div><div class="val mono" id="accBalance">—</div></div>
  <div class="acc-item"><div class="lbl">Currency</div><div class="val mono" id="accCurrency">—</div></div>
  <div class="acc-item"><div class="lbl">Open Positions</div><div class="val mono" id="accOpen">0</div></div>
  <div class="acc-item"><div class="lbl">Total P/L</div><div class="val mono" id="accPL">—</div></div>
  <div class="spacer"></div>
  <span class="demo-badge" id="accTypeBadge">—</span>
</section>

<!-- MAIN -->
<main class="main">
  <div id="bootBanner" class="empty-state">
    <div class="big">⚙️</div>
    <h3>مرحباً بك في TradeRadar PRO — Deriv</h3>
    <p style="margin-bottom:14px">أضف App ID و API Token من Deriv للبدء</p>
    <button class="btn primary" id="btnOpenSettings1">⚙️ فتح الإعدادات</button>
  </div>

  <div id="appContent" class="hidden">
    <section class="cards-grid" id="cardsGrid"></section>

    <section class="content-grid">
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">📈 الشارت</span>
          <div class="tf-group" id="tfGroup"></div>
          <div class="spacer"></div>
          <button class="btn sm" id="btnChartMode">Native</button>
        </div>
        <div id="tvchart"></div>
        <div id="nativeChart" class="hidden"></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">🎯 إشارة التداول</span>
          <div class="spacer"></div>
          <span class="chip" id="sigSymChip">—</span>
        </div>
        <div class="panel-body" id="signalPanel">
          <div class="signal-empty"><div class="big">📡</div><div>بانتظار البيانات...</div></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">📊 المراكز المفتوحة</span>
        <div class="spacer"></div>
        <span class="chip" id="posCountChip">0</span>
        <button class="btn sm" id="btnRefreshPos">🔄 تحديث</button>
      </div>
      <div class="panel-body" id="positionsPanel"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">📒 سجل التداول</span>
        <div class="spacer"></div>
        <button class="btn sm" id="btnCSV">⬇️ CSV</button>
        <button class="btn sm" id="btnJSON">⬇️ JSON</button>
        <button class="btn sm danger" id="btnClearJournal">🗑️ مسح</button>
      </div>
      <div class="panel-body" id="journalPanel"></div>
    </section>
  </div>
</main>

<div class="toasts" id="toastsRoot"></div>
<div id="modalsRoot"></div>

<script>
/* ==========================================================================
   TradeRadar PRO — Deriv WebSocket Auto-Trader
   Single-file app. One IIFE, one App namespace.
   ========================================================================== */
(function(){
'use strict';

/* ===================== 1. UTIL ===================== */
const UTIL = {
  $(s, r=document){ return r.querySelector(s); },
  $$(s, r=document){ return Array.from(r.querySelectorAll(s)); },
  el(tag, attrs={}, ...kids){
    const e = document.createElement(tag);
    for(const k in attrs){
      if(k === 'class') e.className = attrs[k];
      else if(k === 'style') e.style.cssText = attrs[k];
      else if(k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
      else if(k === 'html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    for(const kid of kids){
      if(kid == null) continue;
      e.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    return e;
  },
  fmt(n, d=2){
    if(n == null || !isFinite(n)) return '—';
    return Number(n).toFixed(d);
  },
  fmtPrice(n, digits){
    if(n == null || !isFinite(n)) return '—';
    return Number(n).toFixed(digits ?? 2);
  },
  fmtMoney(n, cur='$'){
    if(n == null || !isFinite(n)) return '—';
    const s = n >= 0 ? '' : '-';
    return s + cur + Math.abs(Number(n)).toFixed(2);
  },
  fmtPct(n){
    if(n == null || !isFinite(n)) return '—';
    return (n >= 0 ? '+' : '') + Number(n).toFixed(2) + '%';
  },
  clamp: (v,a,b) => Math.min(b, Math.max(a, v)),
  uid: () => 'x' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4),
  now: () => Date.now(),
  timeUTC(){
    const d = new Date();
    return String(d.getUTCHours()).padStart(2,'0') + ':' +
           String(d.getUTCMinutes()).padStart(2,'0') + ':' +
           String(d.getUTCSeconds()).padStart(2,'0');
  },
  dateStr(t){
    const d = new Date(t);
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0');
  },
  dateTimeStr(t){
    const d = new Date(t);
    return this.dateStr(t) + ' ' + String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0');
  },
  sleep: (ms) => new Promise(r => setTimeout(r, ms)),
  esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
};

/* ===================== 2. LOGGER ===================== */
const Logger = {
  data(...a){ console.log('🔵', ...a); },
  signal(...a){ console.log('🟢', ...a); },
  auto(...a){ console.log('🤖', ...a); },
  pos(...a){ console.log('📊', ...a); },
  ws(...a){ console.log('📨 WS:', ...a); },
  warn(...a){ console.warn('🟠', ...a); },
  error(...a){ console.error('🔴', ...a); }
};

/* ===================== 4. Store ===================== */
const Store = {
  get(key, fb=null){
    try{ const v = localStorage.getItem(key); return v == null ? fb : JSON.parse(v); }
    catch(e){ return fb; }
  },
  set(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ Logger.warn('Store.set failed', e); return false; }
  },
  del(key){ try{ localStorage.removeItem(key); }catch(e){} }
};

  App.activeTimeframe = App.settings.timeframe || 'M15';

};

/* ===================== 6. DerivAPI ===================== */
const DerivAPI = {
  connect(){
    if(App.ws){
      try{ App.ws.close(); }catch(e){}
      App.ws = null;
    }
    if(!App.settings.appId){
      Logger.warn('No App ID set');
      return;
    }
    const url = `${CONFIG.WS_URL}?app_id=${encodeURIComponent(App.settings.appId)}`;
    UI.setStatus('connecting');
    Logger.data('WS connecting:', url);
    let ws;
    try{ ws = new WebSocket(url); }
    catch(e){ Logger.error('WS create failed', e.message); UI.setStatus('off'); return; }
    App.ws = ws;
    App.wsReady = false;
    App.wsAuth = false;

    ws.onopen = () => {
      App.wsReady = true;
      UI.setStatus('live');
      Logger.data('WS connected');
      // Start ping
      clearInterval(App._pingTimer);
      App._pingTimer = setInterval(() => {
        DerivAPI.send({ ping: 1 });
      }, 30000);
      // Auth if token present
      if(App.settings.token){
        DerivAPI.authorize(App.settings.token).catch(e => {
          Logger.error('Auth on open failed:', e.message);
        });
      }
    };

    ws.onmessage = (ev) => {
      let msg;
      try{ msg = JSON.parse(ev.data); }
      catch(e){ Logger.warn('WS unparsable:', ev.data.slice(0,200)); return; }
      DerivAPI.handle(msg);
    };

    ws.onerror = () => Logger.warn('WS error');
    ws.onclose = () => {
      App.wsReady = false;
      App.wsAuth = false;
      UI.setStatus('off');
      Logger.warn('WS closed');
      clearInterval(App._pingTimer);
      // Reconnect after 3s
      clearTimeout(App._reconnectTimer);
      App._reconnectTimer = setTimeout(() => {
        if(App.settings.appId) DerivAPI.connect();
      }, 3000);
    };
  },

  send(obj){
    if(!App.ws || App.ws.readyState !== WebSocket.OPEN){
      Logger.warn('WS not ready, dropping:', obj);
      return;
    }
    if(obj.req_id == null) obj.req_id = App.reqId++;
    try{ App.ws.send(JSON.stringify(obj)); }
    catch(e){ Logger.error('WS send failed', e.message); }
    return obj.req_id;
  },

  request(obj, timeoutMs=15000){
    return new Promise((resolve, reject) => {
      const reqId = App.reqId++;
      obj.req_id = reqId;
      const timer = setTimeout(() => {
        delete App.pending[reqId];
        reject(new Error('timeout'));
      }, timeoutMs);
      App.pending[reqId] = { resolve, reject, timer };
      if(!App.ws || App.ws.readyState !== WebSocket.OPEN){
        clearTimeout(timer);
        delete App.pending[reqId];
        reject(new Error('WS not ready'));
        return;
      }
      try{ App.ws.send(JSON.stringify(obj)); }
      catch(e){
        clearTimeout(timer);
        delete App.pending[reqId];
        reject(e);
      }
    });
  },

  handle(msg){
    Logger.ws(msg.msg_type || '?', msg.error ? 'ERROR:' + msg.error.code : '');
    // Pending request match
    if(msg.req_id != null && App.pending[msg.req_id]){
      const p = App.pending[msg.req_id];
      clearTimeout(p.timer);
      delete App.pending[msg.req_id];
      if(msg.error){
        p.reject(Object.assign(new Error(msg.error.message || msg.error.code), { code: msg.error.code, raw: msg.error }));
      } else {
        p.resolve(msg);
      }
    }
    // Route by msg_type
    const t = msg.msg_type;
    try{
      if(t === 'tick' && msg.tick) App.onTick(msg.tick);
      else if(t === 'candles' && msg.candles) App.onCandles(msg);
      else if(t === 'balance' && msg.balance) App.onBalance(msg.balance);
      else if(t === 'portfolio' && msg.portfolio) App.onPortfolio(msg.portfolio);
      else if(t === 'proposal_open_contract' && msg.proposal_open_contract) App.onOpenContract(msg.proposal_open_contract);
      else if(t === 'buy' && msg.buy) App.onBuy(msg.buy);
      else if(t === 'sell' && msg.sell) App.onSell(msg.sell);
      else if(t === 'authorize' && msg.authorize) App.onAuthorize(msg.authorize);
      else if(t === 'active_symbols' && msg.active_symbols) App.onActiveSymbols(msg.active_symbols);
    } catch(e){
      Logger.error('handle error for', t, e.message);
    }
  },

  /* ---- Auth ---- */
  async authorize(token){
    Logger.data('Authorizing...');
    const r = await this.request({ authorize: token });
    App.wsAuth = true;
    App.onAuthorize(r.authorize);
    Logger.data('Authorized:', r.authorize.loginid);
    // Subscribe balance + portfolio
    this.send({ balance: 1, subscribe: 1 });
    this.send({ portfolio: 1 });
    return r.authorize;
  },

  /* ---- Active symbols ---- */
  fetchActiveSymbols(){
    return this.request({ active_symbols: 'brief', product_type: 'basic' });
  },

  /* ---- Ticks ---- */
  subscribeTicks(symbol){
    const key = 'tick:' + symbol;
    if(App.subscriptions[key]) return;
    const reqId = this.send({ ticks: symbol, subscribe: 1 });
    if(reqId != null) App.subscriptions[key] = reqId;
    Logger.data('Subscribed ticks:', symbol);
  },

  /* ---- Candles ---- */
  subscribeCandles(symbol, granularity){
    const key = `candles:${symbol}:${granularity}`;
    if(App.subscriptions[key]) return;
    const reqId = this.send({
      ticks_history: symbol,
      adjust_start_time: 1,
      count: 300,
      end: 'latest',
      granularity,
      style: 'candles',
      subscribe: 1
    });
    if(reqId != null) App.subscriptions[key] = reqId;
    Logger.data('Subscribed candles:', symbol, granularity);
  },

  /* ---- Proposal + Buy ---- */
  async getProposal(params){
    return this.request({
      proposal: 1,
      amount: params.amount,
      basis: 'stake',
      contract_type: params.contractType,
      currency: params.currency || 'USD',
      underlying_symbol: params.symbol,
      multiplier: params.multiplier,
      limit_order: params.limitOrder || undefined
    }, 20000);
  },

  async buyContract(proposalId, price){
    return this.request({ buy: proposalId, price }, 20000);
  },

  async sellContract(contractId){
    return this.request({ sell: contractId, price: 0 }, 15000);
  },

  async subscribeOpenContract(contractId){
    return this.request({
      proposal_open_contract: 1,
      contract_id: contractId,
      subscribe: 1
    }, 15000);
  },

  /* ---- Portfolio ---- */
  getPortfolio(){
    return this.request({ portfolio: 1 }, 15000);
  }
};

/* ===================== 7. Indicators ===================== */
const Ind = {
  ema(arr, period){
    const out = new Array(arr.length).fill(null);
    if(arr.length < period) return out;
    const k = 2 / (period + 1);
    let sum = 0;
    for(let i = 0; i < period; i++) sum += arr[i];
    out[period-1] = sum / period;
    for(let i = period; i < arr.length; i++) out[i] = arr[i]*k + out[i-1]*(1-k);
    return out;
  },
  sma(arr, period){
    const out = new Array(arr.length).fill(null);
    if(arr.length < period) return out;
    let sum = 0;
    for(let i = 0; i < arr.length; i++){
      sum += arr[i];
      if(i >= period) sum -= arr[i-period];
      if(i >= period-1) out[i] = sum / period;
    }
    return out;
  },
  rsi(closes, period=14){
    const out = new Array(closes.length).fill(null);
    if(closes.length <= period) return out;
    let g = 0, l = 0;
    for(let i = 1; i <= period; i++){
      const d = closes[i] - closes[i-1];
      if(d > 0) g += d; else l -= d;
    }
    g /= period; l /= period;
    out[period] = l === 0 ? 100 : 100 - 100 / (1 + g/l);
    for(let i = period+1; i < closes.length; i++){
      const d = closes[i] - closes[i-1];
      const gain = d > 0 ? d : 0;
      const loss = d < 0 ? -d : 0;
      g = (g * (period-1) + gain) / period;
      l = (l * (period-1) + loss) / period;
      out[i] = l === 0 ? 100 : 100 - 100 / (1 + g/l);
    }
    return out;
  },
  macd(closes, f=12, s=26, sig=9){
    const ef = this.ema(closes, f);
    const es = this.ema(closes, s);
    const macd = closes.map((_,i) => (ef[i] != null && es[i] != null) ? ef[i]-es[i] : null);
    const macdClean = macd.map(v => v == null ? 0 : v);
    const signal = this.ema(macdClean, sig);
    const hist = macd.map((v,i) => v != null && signal[i] != null ? v - signal[i] : null);
    return { macd, signal, hist };
  },
  bollinger(closes, period=20, mult=2){
    const mid = this.sma(closes, period);
    const upper = new Array(closes.length).fill(null);
    const lower = new Array(closes.length).fill(null);
    const bw = new Array(closes.length).fill(null);
    for(let i = period-1; i < closes.length; i++){
      let sum = 0;
      for(let j = i-period+1; j <= i; j++) sum += Math.pow(closes[j] - mid[i], 2);
      const sd = Math.sqrt(sum/period);
      upper[i] = mid[i] + mult*sd;
      lower[i] = mid[i] - mult*sd;
      bw[i] = mid[i] !== 0 ? (upper[i]-lower[i])/mid[i]*100 : 0;
    }
    return { upper, mid, lower, bandwidth: bw };
  },
  atr(highs, lows, closes, period=14){
    const n = closes.length;
    const tr = new Array(n).fill(0);
    for(let i = 0; i < n; i++){
      if(i === 0) tr[i] = highs[i]-lows[i];
      else tr[i] = Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1]));
    }
    const out = new Array(n).fill(null);
    if(n < period) return out;
    let sum = 0;
    for(let i = 0; i < period; i++) sum += tr[i];
    out[period-1] = sum / period;
    for(let i = period; i < n; i++) out[i] = (out[i-1]*(period-1) + tr[i])/period;
    return out;
  },
  stochastic(highs, lows, closes, k=14, d=3, smooth=3){
    const n = closes.length;
    const rawK = new Array(n).fill(null);
    for(let i = k-1; i < n; i++){
      let hh = -Infinity, ll = Infinity;
      for(let j = i-k+1; j <= i; j++){
        if(highs[j] > hh) hh = highs[j];
        if(lows[j] < ll) ll = lows[j];
      }
      rawK[i] = hh-ll !== 0 ? (closes[i]-ll)/(hh-ll)*100 : 50;
    }
    const kClean = rawK.map(v => v == null ? 50 : v);
    const kS = this.sma(kClean, smooth);
    const dL = this.sma(kS.map(v => v == null ? 50 : v), d);
    return { k: kS, d: dL };
  }
};

/* ===================== 8. Patterns ===================== */
const Patterns = {
  body(b){ return Math.abs(b.close - b.open); },
  range(b){ return b.high - b.low; },
  upperWick(b){ return b.high - Math.max(b.open, b.close); },
  lowerWick(b){ return Math.min(b.open, b.close) - b.low; },
  isBull(b){ return b.close > b.open; },
  isBear(b){ return b.close < b.open; },

  detect(bars, i){
    if(i < 2) return [];
    const b = bars[i], p = bars[i-1];
    const out = [];
    const bodyB = this.body(b), rngB = this.range(b) || 1e-9;
    const uw = this.upperWick(b), lw = this.lowerWick(b);
    if(bodyB/rngB < 0.1) out.push({ name: 'Doji', side: 'neutral' });
    if(lw > bodyB*2 && uw < bodyB*0.8 && bodyB/rngB < 0.4) out.push({ name: 'Hammer', side: 'bull' });
    if(uw > bodyB*2 && lw < bodyB*0.8 && bodyB/rngB < 0.4) out.push({ name: 'Shooting Star', side: 'bear' });
    if(this.isBull(b) && this.isBear(p) && b.close > p.open && b.open < p.close) out.push({ name: 'Bullish Engulfing', side: 'bull' });
    if(this.isBear(b) && this.isBull(p) && b.close < p.open && b.open > p.close) out.push({ name: 'Bearish Engulfing', side: 'bear' });
    if(lw > bodyB*1.5 && uw < bodyB*0.5 && bodyB/rngB < 0.35 && this.isBull(b)) out.push({ name: 'Bullish Pin Bar', side: 'bull' });
    if(uw > bodyB*1.5 && lw < bodyB*0.5 && bodyB/rngB < 0.35 && this.isBear(b)) out.push({ name: 'Bearish Pin Bar', side: 'bear' });
    return out;
  },

  swingPoints(bars, lookback=20){
    const n = bars.length;
    const highs = [], lows = [];
    for(let i = lookback; i < n-lookback; i++){
      let isH = true, isL = true;
      for(let j = i-lookback; j <= i+lookback; j++){
        if(j === i) continue;
        if(bars[j].high >= bars[i].high) isH = false;
        if(bars[j].low <= bars[i].low) isL = false;
      }
      if(isH) highs.push({ i, price: bars[i].high });
      if(isL) lows.push({ i, price: bars[i].low });
    }
    return { highs, lows };
  },

  structure(bars, lookback=20){
    const sw = this.swingPoints(bars, lookback);
    const last = bars[bars.length-1];
    const lastHigh = sw.highs.length ? sw.highs[sw.highs.length-1] : null;
    const lastLow = sw.lows.length ? sw.lows[sw.lows.length-1] : null;
    const bos = { bull: false, bear: false };
    if(lastHigh && last.close > lastHigh.price) bos.bull = true;
    if(lastLow && last.close < lastLow.price) bos.bear = true;
    let trend = 'neutral';
    if(sw.highs.length >= 2 && sw.lows.length >= 2){
      const h1 = sw.highs[sw.highs.length-2].price, h2 = lastHigh.price;
      const l1 = sw.lows[sw.lows.length-2].price, l2 = lastLow.price;
      if(h2 > h1 && l2 > l1) trend = 'up';
      else if(h2 < h1 && l2 < l1) trend = 'down';
    }
    return { bos, trend, lastHigh, lastLow, highs: sw.highs, lows: sw.lows };
  }
};

/* ===================== 9. Strategy ===================== */
const Strategy = {
  compute(bars){
    const closes = bars.map(b => b.close);
    const highs = bars.map(b => b.high);
    const lows = bars.map(b => b.low);
    return {
      ema9: Ind.ema(closes, 9),
      ema21: Ind.ema(closes, 21),
      ema50: Ind.ema(closes, 50),
      ema200: Ind.ema(closes, 200),
      rsi: Ind.rsi(closes, 14),
      macd: Ind.macd(closes),
      bb: Ind.bollinger(closes, 20, 2),
      atr: Ind.atr(highs, lows, closes, 14),
      stoch: Ind.stochastic(highs, lows, closes, 14, 3, 3)
    };
  },

  analyze(bars, symbol){
    if(!bars || bars.length < 200) return null;
    const ind = this.compute(bars);
    const n = bars.length;
    const i = n-1;
    const price = bars[i].close;
    const atr = ind.atr[i];
    if(atr == null || !isFinite(atr) || atr <= 0) return null;

    const reasons = [];
    let score = 0;
    let direction = null;

    // 1) Trend alignment (+25)
    const trendUp = ind.ema9[i] > ind.ema21[i] && ind.ema21[i] > ind.ema50[i] && ind.ema50[i] > ind.ema200[i];
    const trendDn = ind.ema9[i] < ind.ema21[i] && ind.ema21[i] < ind.ema50[i] && ind.ema50[i] < ind.ema200[i];
    if(trendUp){ score += 25; direction = 'BUY'; reasons.push('ترتيب EMA صاعد (9>21>50>200)'); }
    else if(trendDn){ score += 25; direction = 'SELL'; reasons.push('ترتيب EMA هابط (9<21<50<200)'); }
    else {
      if(ind.ema9[i] > ind.ema21[i] && ind.ema21[i] > ind.ema50[i]){ score += 15; direction = direction || 'BUY'; reasons.push('EMA قصير صاعد'); }
      if(ind.ema9[i] < ind.ema21[i] && ind.ema21[i] < ind.ema50[i]){ score += 15; direction = direction || 'SELL'; reasons.push('EMA قصير هابط'); }
    }

    // 2) RSI extreme + reversal (+15)
    const rsiV = ind.rsi[i];
    if(rsiV != null){
      if(rsiV < 30 && bars[i].close > bars[i-1].close){ score += 15; direction = direction || 'BUY'; reasons.push(`RSI=${rsiV.toFixed(1)} تشبع بيعي + ارتداد`); }
      else if(rsiV > 70 && bars[i].close < bars[i-1].close){ score += 15; direction = direction || 'SELL'; reasons.push(`RSI=${rsiV.toFixed(1)} تشبع شرائي + ارتداد`); }
    }

    // 3) MACD (+20)
    const mh = ind.macd.hist[i], mhp = ind.macd.hist[i-1];
    if(mh != null && mhp != null){
      if(mh > 0 && mh > mhp){ score += 20; direction = direction || 'BUY'; reasons.push('MACD إيجابي متزايد'); }
      else if(mh < 0 && mh < mhp){ score += 20; direction = direction || 'SELL'; reasons.push('MACD سلبي متزايد'); }
      else if(mh > 0){ score += 10; reasons.push('MACD فوق الصفر'); }
      else if(mh < 0){ score += 10; reasons.push('MACD تحت الصفر'); }
    }

    // 4) Bollinger breakout (+10)
    const bbU = ind.bb.upper[i], bbL = ind.bb.lower[i];
    if(bbU != null && bbL != null){
      if(price > bbU){ score += 10; direction = direction || 'BUY'; reasons.push('اختراق بولنجر العلوي'); }
      else if(price < bbL){ score += 10; direction = direction || 'SELL'; reasons.push('اختراق بولنجر السفلي'); }
    }

    // 5) Stochastic OB/OS cross (+10)
    const sk = ind.stoch.k[i], sd = ind.stoch.d[i];
    const skp = ind.stoch.k[i-1], sdp = ind.stoch.d[i-1];
    if(sk != null && sd != null && skp != null && sdp != null){
      const crossUp = sk > sd && skp <= sdp;
      const crossDn = sk < sd && skp >= sdp;
      if(crossUp && sk < 30){ score += 10; direction = direction || 'BUY'; reasons.push('Stoch تقاطع صاعد في OB'); }
      else if(crossDn && sk > 70){ score += 10; direction = direction || 'SELL'; reasons.push('Stoch تقاطع هابط في OS'); }
    }

    // 6) Pattern at S/R (+15)
    const struct = Patterns.structure(bars, 15);
    const pats = Patterns.detect(bars, i);
    const nearSR = this.isNearSR(price, struct, atr);
    if(pats.length && nearSR){
      const p = pats[0];
      score += 15;
      if(p.side === 'bull') direction = direction || 'BUY';
      else if(p.side === 'bear') direction = direction || 'SELL';
      reasons.push(`${p.name} @ S/R`);
    } else if(pats.length){
      score += 5;
      reasons.push(pats[0].name);
    }

    // 7) BOS / CHoCH (+5)
    if(struct.bos.bull){ score += 5; direction = direction || 'BUY'; reasons.push('BOS صاعد'); }
    if(struct.bos.bear){ score += 5; direction = direction || 'SELL'; reasons.push('BOS هابط'); }

    score = UTIL.clamp(score, 0, 100);
    if(!direction) direction = 'BUY';

    let tier = 'NO TRADE';
    if(score >= 85) tier = 'ELITE';
    else if(score >= 70) tier = 'STRONG';
    else if(score >= 55) tier = 'MEDIUM';

    // Trade levels (ATR-based)
    const entry = price;
    const dir = direction;
    const sl  = dir === 'BUY' ? entry - 1.5*atr : entry + 1.5*atr;
    const tp1 = dir === 'BUY' ? entry + 1.5*atr : entry - 1.5*atr;
    const tp2 = dir === 'BUY' ? entry + 2.5*atr : entry - 2.5*atr;
    const tp3 = dir === 'BUY' ? entry + 4.0*atr : entry - 4.0*atr;

    return {
      symbol, direction: dir, score, tier,
      price, atr, entry, sl, tp1, tp2, tp3,
      reasons,
      indicators: {
        rsi: rsiV,
        ema9: ind.ema9[i], ema21: ind.ema21[i], ema50: ind.ema50[i], ema200: ind.ema200[i],
        macdHist: mh, stochK: sk, stochD: sd
      },
      generatedAt: Date.now()
    };
  },

  isNearSR(price, struct, atr){
    const tol = atr * 0.6;
    const all = [...struct.highs.slice(-3), ...struct.lows.slice(-3)];
    for(const p of all){
      if(Math.abs(price - p.price) <= tol) return true;
    }
    return false;
  }
};

/* ===================== 10. Risk ===================== */
const Risk = {
  calcStake(signal){
    const bal = Number(App.account?.balance ?? 0);
    if(!bal || bal <= 0) return { stake: 1, reason: 'no_balance' };
    let stake = bal * (App.settings.riskPct / 100);
    stake = Math.max(1, Math.round(stake * 100) / 100); // min $1, 2dp
    return { stake, reason: 'ok' };
  },

  calcLimitOrder(signal, stake, multiplier){
    // Convert price distances to monetary amounts for MULT limit_order
    const entry = signal.entry;
    const slDist = Math.abs(signal.sl - entry);
    const tpDist = Math.abs(signal.tp2 - entry); // use TP2 as broker TP
    const slPct = slDist / entry;
    const tpPct = tpDist / entry;
    const stopLoss = Math.round(stake * slPct * multiplier * 100) / 100;
    const takeProfit = Math.round(stake * tpPct * multiplier * 100) / 100;
    return { stop_loss: stopLoss, take_profit: takeProfit };
  }
};

/* ===================== 11. Journal ===================== */
const Journal = {
  load(){
    const d = Store.get(CONFIG.STORE_JOURNAL, null);
    if(d && Array.isArray(d.trades)) App.journal = d;
    else App.journal = { trades: [] };
  },
  save(){ Store.set(CONFIG.STORE_JOURNAL, App.journal); },
  trades(){ return App.journal.trades; },
  add(t){ App.journal.trades.unshift(t); this.save(); UI.renderJournal(); },
  update(id, patch){
    const t = App.journal.trades.find(x => x.id === id);
    if(!t) return;
    Object.assign(t, patch);
    this.save();
    UI.renderJournal();
  },
  delete(id){
    App.journal.trades = App.journal.trades.filter(x => x.id !== id);
    this.save();
    UI.renderJournal();
  },
  clear(){ App.journal.trades = []; this.save(); UI.renderJournal(); },
  stats(){
    const closed = this.trades().filter(t => t.status !== 'OPEN');
    const total = closed.length;
    const wins = closed.filter(t => (t.pnl || 0) > 0);
    const losses = closed.filter(t => (t.pnl || 0) <= 0);
    const winRate = total ? (wins.length/total)*100 : 0;
    const totalPnl = closed.reduce((s,t) => s + (t.pnl || 0), 0);
    const grossWin = wins.reduce((s,t) => s + (t.pnl || 0), 0);
    const grossLoss = Math.abs(losses.reduce((s,t) => s + (t.pnl || 0), 0));
    const pf = grossLoss > 0 ? grossWin/grossLoss : (grossWin > 0 ? Infinity : 0);
    return { total, wins: wins.length, losses: losses.length, winRate, totalPnl, pf };
  }
};

/* ===================== 12. AutoTrade ===================== */
const AutoTrade = {
  toggle(on){
    if(on){
      const isVirtual = App.account?.is_virtual;
      if(isVirtual === 0 && !App._realConfirmed){
        UI.toast('⚠️ أنت على حساب حقيقي — أكّد المخاطر أولاً', 'error');
        return;
      }
      App.autoTrade.active = true;
    } else {
      App.autoTrade.active = false;
    }
    App.settings.autoTrade = App.autoTrade.active;
    App.saveSettings();
    UI.renderAutoTradeBtn();
  },

  async maybeExecute(signal){
    if(!App.autoTrade.active) return;
    if(!signal || signal.tier === 'NO TRADE') return;
    if(signal.score < App.settings.minScore) return;

    // Real account guard
    if(App.account?.is_virtual === 0 && !App._realConfirmed) return;

    // Cooldown per symbol+direction (10 min)
    const key = signal.symbol + '|' + signal.direction;
    if(Date.now() - (App._lastAutoTradeAt[key] || 0) < 10*60*1000){
      Logger.auto('Cooldown:', key);
      return;
    }
    // No duplicate open contract on same symbol
    const dup = App.positions.find(p => p.symbol === signal.symbol);
    if(dup){ Logger.auto('Already open:', signal.symbol); return; }

    App._lastAutoTradeAt[key] = Date.now();

    const stake = Risk.calcStake(signal);
    if(stake.reason !== 'ok'){ Logger.warn('Sizing failed:', stake.reason); return; }

    const contractType = signal.direction === 'BUY' ? 'MULTUP' : 'MULTDOWN';
    const limitOrder = Risk.calcLimitOrder(signal, stake.stake, App.settings.multiplier);

    Logger.auto('Placing proposal:', { symbol: signal.symbol, type: contractType, stake: stake.stake });
    let proposalResp;
    try{
      proposalResp = await DerivAPI.getProposal({
        amount: stake.stake,
        contractType,
        symbol: signal.symbol,
        multiplier: App.settings.multiplier,
        limitOrder
      });
    } catch(e){
      const msg = translateError(e);
      Logger.error('Proposal failed:', e.code || e.message, e.raw || '');
      UI.toast('❌ فشل الطلب: ' + msg, 'error');
      return;
    }

    const proposal = proposalResp.proposal;
    if(!proposal || !proposal.id){
      Logger.error('No proposal id', proposalResp);
      UI.toast('❌ لم يُعد المُقترح', 'error');
      return;
    }

    Logger.auto('Buying proposal:', proposal.id, 'ask:', proposal.ask_price);
    let buyResp;
    try{
      buyResp = await DerivAPI.buyContract(proposal.id, proposal.ask_price);
    } catch(e){
      const msg = translateError(e);
      Logger.error('Buy failed:', e.code || e.message, e.raw || '');
      UI.toast('❌ فشل التنفيذ: ' + msg, 'error');
      return;
    }

    const contractId = buyResp.buy?.contract_id;
    if(!contractId){
      Logger.error('No contract id', buyResp);
      UI.toast('❌ لم يُعد معرّف العقد', 'error');
      return;
    }

    Logger.auto('✅ Contract:', contractId);

    Journal.add({
      id: UTIL.uid(),
      contractId: String(contractId),
      openedAt: Date.now(),
      closedAt: null,
      symbol: signal.symbol,
      direction: signal.direction,
      entry: signal.entry,
      sl: signal.sl,
      tp1: signal.tp1,
      tp2: signal.tp2,
      tp3: signal.tp3,
      stake: stake.stake,
      multiplier: App.settings.multiplier,
      score: signal.score,
      tier: signal.tier,
      atr: signal.atr,
      reasons: [...signal.reasons],
      status: 'OPEN',
      pnl: 0,
      exitPrice: null,
      exitReason: null,
      source: 'AUTO'
    });

    UI.toast('✅ عقد #' + contractId + ' نُفّذ', 'success');
    beep();
    // Subscribe to contract updates
    DerivAPI.send({ proposal_open_contract: 1, contract_id: contractId, subscribe: 1 });
    App.refreshPortfolio();
  },

  async killSwitch(){
    Logger.auto('KILL SWITCH');
    this.toggle(false);
    const positions = App.positions.slice();
    if(!positions.length){
      UI.toast('🛑 لا توجد مراكز مفتوحة', 'info');
      return;
    }
    let closed = 0, failed = 0;
    for(const p of positions){
      const cid = p.contract_id;
      if(!cid){ failed++; continue; }
      try{
        await DerivAPI.sellContract(cid);
        closed++;
        Logger.pos('Closed', cid);
      } catch(e){
        failed++;
        Logger.error('Close failed', cid, e.message);
      }
      await UTIL.sleep(200);
    }
    UI.toast(`🛑 أُغلق ${closed} عقد${failed ? ` · فشل ${failed}` : ''}`, failed ? 'warn' : 'success');
    setTimeout(() => App.refreshPortfolio(), 1000);
  }
};

function translateError(e){
  const code = e.code || '';
  const map = {
    'AuthorizationRequired': 'المفتاح غير صالح أو منتهي',
    'InvalidToken': 'الرمز غير صحيح — تحقق من Deriv Dashboard',
    'RateLimit': 'تجاوزت الحد — انتظر قليلاً',
    'MarketIsClosed': 'السوق مغلق حالياً',
    'InsufficientBalance': 'الرصيد غير كافٍ',
    'InvalidSymbol': 'الرمز غير متاح',
    'ContractCreationFailure': 'فشل إنشاء العقد',
    'PleaseAuthenticate': 'يجب تسجيل الدخول أولاً'
  };
  return map[code] || e.message || code || 'خطأ غير معروف';
}

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [880, 1320].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f;
      o.type = 'sine';
      g.gain.setValueAtTime(0.0001, now + i*0.18);
      g.gain.exponentialRampToValueAtTime(0.12, now + i*0.18 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i*0.18 + 0.18);
      o.connect(g).connect(ctx.destination);
      o.start(now + i*0.18);
      o.stop(now + i*0.18 + 0.2);
    });
  } catch(e){}
}

  App.account.currency = b.currency;
  App.account.loginid = b.loginid;
  UI.renderAccount();
};

App.onPortfolio = function(p){
  App.positions = p.contracts || [];
  UI.renderPositions();
  UI.renderAccount();
  // Reconcile journal
  for(const t of App.journal.trades){
    if(t.status !== 'OPEN') continue;
    const still = App.positions.find(c => String(c.contract_id) === String(t.contractId));
    if(!still){
      t.status = 'CLOSED';
      t.closedAt = Date.now();
      t.exitReason = 'Broker';
      Logger.pos('Reconciled:', t.contractId);
    }
  }
  Journal.save();
  UI.renderJournal();
};

App.onOpenContract = function(c){
  // Update journal P&L live
  const t = App.journal.trades.find(x => String(x.contractId) === String(c.contract_id));
  if(t){
    t.pnl = parseFloat(c.profit) || 0;
    t.status = c.is_sold ? 'CLOSED' : 'OPEN';
    if(c.is_sold){
      t.closedAt = Date.now();
      t.exitPrice = parseFloat(c.exit_tick) || null;
      t.exitReason = c.profit > 0 ? 'TP' : 'SL/Timeout';
    }
    Journal.save();
    UI.renderJournal();
  }
};

App.onBuy = function(b){
  Logger.data('Buy ack:', b.contract_id);
};

App.onSell = function(s){
  Logger.data('Sell ack:', s.contract_id, 'sold_for:', s.sold_for);
};

App.onTick = function(tick){
  const sym = tick.symbol;
  const bid = num(tick.bid);
  const ask = num(tick.ask);
  const mid = bid != null && ask != null ? (bid + ask) / 2 : num(tick.quote);
  if(mid == null) return;
  const prev = App.prices[sym];
  const prevMid = prev?.mid ?? null;
  App.prices[sym] = { bid, ask, mid, prevMid, epoch: tick.epoch, ts: Date.now() };
  if(!App.spark[sym]) App.spark[sym] = [];
  App.spark[sym].push(mid);
  if(App.spark[sym].length > 60) App.spark[sym].shift();
  UI.onPriceTick(sym, mid, prevMid);
};

App.onCandles = function(msg){
  const sym = msg.echo_req.ticks_history;
  const granularity = msg.echo_req.granularity;
  const key = `candles:${sym}:${granularity}`;
  const raw = msg.candles || [];
  const bars = raw.map(c => ({
    time: c.epoch,
    open: +c.open,
    high: +c.high,
    low: +c.low,
    close: +c.close
  })).filter(b => isFinite(b.open) && isFinite(b.close));
  if(!bars.length) return;
  App.candles[sym] = bars;
  App.indicators[sym] = Strategy.compute(bars);
  // Update chart if this is the active symbol
  if(App.settings[App.activeSlot + 'Symbol'] === sym){
    ChartEngine.updateNative(bars);
  }
  // Recompute signal
  const sig = Strategy.analyze(bars, sym);
  if(sig){
    App.signals[sym] = sig;
    Logger.signal(`${sym} score=${sig.score} ${sig.tier} ${sig.direction}`);
    if(sig.score >= 70){
      const k = sym + '|' + sig.direction;
      const last = App._lastSignalAlert?.[k] || 0;
      if(Date.now() - last > 10*60*1000){
        if(!App._lastSignalAlert) App._lastSignalAlert = {};
        App._lastSignalAlert[k] = Date.now();
        UI.toast(`🎯 ${sig.tier}: ${sym} ${sig.direction} (${sig.score})`, 'success');
      }
    }
    AutoTrade.maybeExecute(sig);
  }
  UI.renderSignal();
  UI.renderCards();
};

App.onActiveSymbols = function(symbols){
  App.activeSymbols = symbols.map(s => s.symbol);
  Logger.data('Active symbols:', App.activeSymbols.length);
  // Auto-detect Nasdaq symbol if needed
  App.detectNasdaqSymbol();
};

App.refreshPortfolio = async function(){
  if(!App.wsReady || !App.wsAuth) return;
  try{
    const r = await DerivAPI.getPortfolio();
    if(r.portfolio) App.onPortfolio(r.portfolio);
  } catch(e){ Logger.warn('Portfolio failed:', e.message); }
};

App.detectNasdaqSymbol = function(){
  const candidates = CONFIG.NASDAQ_CANDIDATES;
  const available = App.activeSymbols || [];
  for(const c of candidates){
    if(available.includes(c)){
      if(App.settings.nasdaqSymbol !== c){
        App.settings.nasdaqSymbol = c;
        App.saveSettings();
        UI.toast('✅ رمز ناسداك: ' + c, 'success');
        Logger.data('Nasdaq resolved:', c);
        // Resubscribe
        DerivAPI.subscribeTicks(c);
        DerivAPI.subscribeCandles(c, CONFIG.TF[App.activeTimeframe].granularity);
      }
      return c;
    }
  }
  Logger.warn('Nasdaq symbol not found in active_symbols');
  return null;
};

App.fetchActiveSymbols = async function(){
  try{
    const r = await DerivAPI.fetchActiveSymbols();
    if(r.active_symbols) App.onActiveSymbols(r.active_symbols);
  } catch(e){ Logger.warn('active_symbols failed:', e.message); }
};

function num(v){
  if(v == null) return null;
  const n = Number(v);
  return isFinite(n) ? n : null;
}

/* ===================== 14. ChartEngine ===================== */
const ChartEngine = {
  tvWidget: null,
  nativeChart: null,
  candleSeries: null,
  _tvLoaded: false,
  mode: 'tv',

  async initTV(){
    const container = UTIL.$('#tvchart');
    if(!container) return;
    container.innerHTML = '';
    try{
      await this.loadTV();
      const sym = App.settings[App.activeSlot + 'Symbol'];
      const tvSymbol = CONFIG.TV_SYMBOL[sym] || sym;
      this.tvWidget = new window.TradingView.widget({
        container_id: 'tvchart',
        autosize: true,
        symbol: tvSymbol,
        interval: this.mapInterval(App.activeTimeframe),
        timezone: 'Etc/UTC',
        theme: 'dark',
        style: '1',
        locale: 'ar',
        toolbar_bg: '#131826',
        enable_publishing: false,
        hide_side_toolbar: true,
        allow_symbol_change: false,
        studies: ['RSI@tv-basicstudies'],
        disabled_features: ['use_localstorage_for_settings','header_symbol_search'],
        overrides: { 'paneProperties.background': '#0b0f19' }
      });
    } catch(e){
      container.innerHTML = '<div class="empty-state"><div class="big">📈</div><p>تعذر تحميل TradingView</p></div>';
      Logger.warn('TV load error', e.message);
    }
  },

  loadTV(){
    return new Promise((res, rej) => {
      if(window.TradingView){ res(); return; }
      if(this._tvLoaded){ rej(new Error('tv load failed')); return; }
      const s = document.createElement('script');
      s.src = 'https://s3.tradingview.com/tv.js';
      s.async = true;
      s.onload = () => { this._tvLoaded = true; res(); };
      s.onerror = () => rej(new Error('tv script failed'));
      document.head.appendChild(s);
    });
  },

  mapInterval(tf){
    return { M5: '5', M15: '15', H1: '60', H4: '240', D1: 'D' }[tf] || '15';
  },

  initNative(){
    const container = UTIL.$('#nativeChart');
    if(!container || !window.LightweightCharts) return;
    container.innerHTML = '';
    const chart = window.LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: 220,
      layout: { background: { color: '#0b0f19' }, textColor: '#6b7280', fontSize: 10 },
      grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
      timeScale: { borderColor: '#1f2937', timeVisible: true },
      rightPriceScale: { borderColor: '#1f2937' }
    });
    this.nativeChart = chart;
    this.candleSeries = chart.addCandlestickSeries({
      upColor: '#00ffa3', downColor: '#ff3b5c',
      borderUpColor: '#00ffa3', borderDownColor: '#ff3b5c',
      wickUpColor: '#00ffa3', wickDownColor: '#ff3b5c'
    });
    new ResizeObserver(() => {
      if(container && chart) chart.applyOptions({ width: container.clientWidth });
    }).observe(container);
  },

  updateNative(bars){
    if(!this.candleSeries || !bars || !bars.length) return;
    try{
      this.candleSeries.setData(bars.map(b => ({
        time: b.time, open: b.open, high: b.high, low: b.low, close: b.close
      })));
    } catch(e){ Logger.warn('native update failed', e.message); }
  },

  async reload(){
    if(this.mode === 'tv'){
      UTIL.$('#tvchart').classList.remove('hidden');
      UTIL.$('#nativeChart').classList.add('hidden');
      UTIL.$('#btnChartMode').textContent = 'Native';
      if(this.tvWidget){ try{ this.tvWidget.remove(); }catch(e){} this.tvWidget = null; }
      await this.initTV();
    } else {
      UTIL.$('#tvchart').classList.add('hidden');
      UTIL.$('#nativeChart').classList.remove('hidden');
      UTIL.$('#btnChartMode').textContent = 'TradingView';
      this.initNative();
      const sym = App.settings[App.activeSlot + 'Symbol'];
      this.updateNative(App.candles[sym]);
    }
  }
};

  onPriceTick(symbol, mid, prevMid){
    for(const slot of ['gold','euro','nasdaq']){
      if(App.settings[slot + 'Symbol'] !== symbol) continue;
      const el = this.$('#price_' + slot);
      if(!el || mid == null) return;
      const digits = CONFIG.DIGITS[symbol] ?? 2;
      el.textContent = UTIL.fmtPrice(mid, digits);
      if(prevMid != null && mid > prevMid){
        el.classList.remove('flash-dn'); el.classList.add('flash-up');
        setTimeout(() => el.classList.remove('flash-up'), 520);
      } else if(prevMid != null && mid < prevMid){
        el.classList.remove('flash-up'); el.classList.add('flash-dn');
        setTimeout(() => el.classList.remove('flash-dn'), 520);
      }
      const spark = App.spark[symbol] || [];
      if(spark.length >= 2){
        const first = spark[0];
        const pct = ((mid - first) / first) * 100;
        const cEl = this.$('#chg_' + slot);
        cEl.textContent = UTIL.fmtPct(pct);
        cEl.className = 'card-chg ' + (pct >= 0 ? 'up' : 'dn');
      }
      this.drawSpark(slot, spark, mid >= (prevMid ?? mid));
      return;
    }
  },

  drawSpark(slot, arr, up){
    const c = this.$('#spark_' + slot);
    if(!c) return;
    const ctx = c.getContext('2d');
    const W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);
    if(arr.length < 2) return;
    const mn = Math.min(...arr), mx = Math.max(...arr);
    const rng = mx - mn || 1;
    ctx.beginPath();
    for(let i = 0; i < arr.length; i++){
      const x = (i / (arr.length-1)) * W;
      const y = H - ((arr[i]-mn)/rng) * (H-4) - 2;
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = up ? '#00ffa3' : '#ff3b5c';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  },

        <button class="btn danger" id="btnConfirmKill">🛑 نعم، أغلق الكل</button>
      </div>`;
    UTIL.$$('[data-close]', m).forEach(b => b.addEventListener('click', () => m.parentElement.remove()));
    UTIL.$('#btnConfirmKill', m).addEventListener('click', async () => {
      m.parentElement.remove();
      await AutoTrade.killSwitch();
    });
  },

  exportCSV(){
    const trades = Journal.trades();
    if(!trades.length){ this.toast('لا توجد صفقات', 'warn'); return; }
    const headers = ['id','contractId','openedAt','closedAt','symbol','direction','stake','multiplier','entry','sl','tp1','tp2','tp3','score','tier','status','exitReason','pnl'];
    const rows = [headers.join(',')];
    for(const t of trades){
      rows.push(headers.map(h => {
        let v = t[h];
        if(v == null) return '';
        return '"' + String(v).replace(/"/g,'""') + '"';
      }).join(','));
    }
    const blob = new Blob(['\uFEFF' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'deriv_trades_' + UTIL.dateStr(Date.now()) + '.csv';
    a.click(); URL.revokeObjectURL(url);
  },

  exportJSON(){
    const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), trades: Journal.trades() }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'deriv_trades_' + UTIL.dateStr(Date.now()) + '.json';
    a.click(); URL.revokeObjectURL(url);
  }
};

/* ===================== 16. Boot ===================== */
App.boot = async function(){
  if(App.booted) return;
  App.booted = true;
  UTIL.$('#bootBanner').classList.add('hidden');
  UTIL.$('#appContent').classList.remove('hidden');
  UI.init();

  Logger.data('Booting with:', { appId: App.settings.appId, gold: App.settings.goldSymbol, euro: App.settings.euroSymbol, nasdaq: App.settings.nasdaqSymbol });

  // Fetch active symbols
  App.fetchActiveSymbols().catch(e => Logger.warn('active_symbols failed', e.message));

  // Subscribe to ticks + candles
  for(const slot of ['gold','euro','nasdaq']){
    const sym = App.settings[slot + 'Symbol'];
    DerivAPI.subscribeTicks(sym);
    DerivAPI.subscribeCandles(sym, CONFIG.TF[App.activeTimeframe].granularity);
    await UTIL.sleep(200);
  }

  // Initial chart
  ChartEngine.mode = 'tv';
  ChartEngine.reload();
  UI.selectSlot('gold');

  // Portfolio polling every 5s
  clearInterval(App._portfolioTimer);
  App._portfolioTimer = setInterval(() => App.refreshPortfolio(), 5000);

  // Restore auto-trade from settings
  if(App.settings.autoTrade){
    App.autoTrade.active = true;
    UI.renderAutoTradeBtn();
    UI.toast('🤖 Auto-Trade استُعيد من الإعدادات', 'info');
  }

  Logger.data('Boot complete');
};

function start(){
  App.loadSettings();
  Journal.load();

  window.addEventListener('beforeunload', () => {
    clearInterval(App._pingTimer);
    clearInterval(App._portfolioTimer);
    clearTimeout(App._reconnectTimer);
    if(App.ws){ try{ App.ws.close(); }catch(e){} }
  });

  if(App.settings.appId && App.settings.token){
    // Auto-boot: connect + auth
    DerivAPI.connect();
    let tries = 0;
    const iv = setInterval(async () => {
      tries++;
      if(App.wsReady){
        clearInterval(iv);
        try{
          await DerivAPI.authorize(App.settings.token);
          App.boot();
        } catch(e){
          UI.toast('⚠️ فشل التحقق: ' + translateError(e), 'error');
          UI.openSettingsModal();
        }
      } else if(tries > 80){
        clearInterval(iv);
        UI.toast('⚠️ تعذر الاتصال بـ Deriv', 'error');
        UI.openSettingsModal();
      }
    }, 100);
  } else {
    UI.openSettingsModal();
  }
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();

})();
</script>
